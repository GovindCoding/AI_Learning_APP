server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**
        - id: learning-service
          uri: lb://learning-service
          predicates:
            - Path=/api/v1/learning/**
        - id: tools-news-service
          uri: lb://tools-news-service
          predicates:
            - Path=/api/v1/tools/**, /api/v1/news/**, /api/v1/social/**
        - id: social-image-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/image/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
